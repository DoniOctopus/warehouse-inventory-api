spring:
  # Isolated in-memory database per test context, without sample data.
  datasource:
    url: jdbc:h2:mem:warehouse-test;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 50
  flyway:
    locations: classpath:db/migration
  data:
    web:
      pageable:
        max-page-size: 100
